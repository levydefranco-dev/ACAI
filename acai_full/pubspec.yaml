name: acai
description: AÇAI - Mensagens seguras com camuflagem visual
publish_to: 'none'
version: 1.2.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3
  http: ^1.1.0
  package_info_plus: ^8.0.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  cupertino_icons: ^1.0.6
  uuid: ^4.0.0
  intl: ^0.19.0
  file_picker: ^8.0.0
  flutter_webrtc: ^0.11.7
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon_1024.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon_1024.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/acai_facade_banner.jpg
    - assets/icon_1024.png
