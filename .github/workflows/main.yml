name: Build AÇAI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Verificar estrutura
        run: |
          echo "=== Conteúdo da raiz ==="
          ls -la
          echo ""
          echo "=== Procurando pubspec.yaml ==="
          find . -name "pubspec.yaml" | head -5

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter pub get
          elif [ -f "acai_full/pubspec.yaml" ]; then
            cd acai_full
            flutter pub get
          else
            echo "ERRO: pubspec.yaml não encontrado!"
            exit 1
          fi

      - name: Build APK
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter build apk --release
          else
            cd acai_full
            flutter build apk --release
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: acai-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            acai_full/build/app/outputs/flutter-apk/app-release.apk
